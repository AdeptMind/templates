{{- if .Values.argocd.enabled }}
apiVersion: cpln.io/v1
kind: identity
metadata:
  name: {{ include "redis.sentinelIdentity.name" . }}
  namespace: {{ .Release.Namespace }}
org: {{ required "argocd.org is required when argocd.enabled is true" .Values.argocd.org }}
description: Redis Sentinel Identity
tags: {{- include "redis.tags" . | nindent 2 }}
gvc: {{ .Values.global.cpln.gvc }}
{{- end }}
