{{- if .Values.argocd.enabled }}
{{- $payload := printf "bind 0.0.0.0\nprotected-mode no\nsave 900 1\nsave 300 10\nsave 60 10000\nappendonly yes\nrepl-backlog-size %v\nrepl-timeout %v\nclient-output-buffer-limit slave %v" .Values.redis.replication.backlogSize .Values.redis.replication.timeout .Values.redis.replication.slaveOutputBufferLimit }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis.secretConfig.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    cpln.io/org: {{ required "argocd.org is required when argocd.enabled is true" .Values.argocd.org }}
  labels:
    app.kubernetes.io/managed-by: cpln-operator
type: Opaque
data:
  encoding: {{ "plain" | b64enc }}
  payload: {{ $payload | b64enc }}
{{- end }}
