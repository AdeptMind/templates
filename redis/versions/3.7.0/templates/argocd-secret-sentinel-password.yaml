{{- if .Values.argocd.enabled }}
{{- if and (hasKey .Values.sentinel "auth") (hasKey .Values.sentinel.auth "password") .Values.sentinel.auth.password.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis.sentinelSecretPassword.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    cpln.io/org: {{ required "argocd.org is required when argocd.enabled is true" .Values.argocd.org }}
  labels:
    app.kubernetes.io/managed-by: cpln-operator
type: Dictionary
data:
  password: {{ .Values.sentinel.auth.password.value | b64enc }}
{{- end }}
{{- end }}
