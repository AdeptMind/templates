{{- if not .Values.argocd.enabled }}
kind: secret
name: {{ include "keycloak.secretStartup.name" . }}
description: Keycloak startup script
tags: {{- include "keycloak.tags" . | nindent 4 }}
type: opaque
data:
  encoding: plain
  payload: |-
    {{- include "keycloak.startupScript" . | nindent 4 }}
{{- end }}
