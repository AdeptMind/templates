{{- if .Values.argocd.enabled }}
{{- include "pgvector.validate" . -}}
apiVersion: cpln.io/v1
kind: volumeset
metadata:
  name: {{ include "pgvector.volume.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Argo prune would otherwise delete the volumeset, and the database data with it.
    cpln.io/resource-policy: keep
org: {{ required "argocd.org is required when argocd.enabled is true" .Values.argocd.org }}
gvc: {{ .Values.global.cpln.gvc }}
description: pgvector volumeset
tags:
  {{- include "pgvector.tags" . | nindent 4 }}
spec:
  fileSystemType: ext4
  initialCapacity: {{ .Values.volumeset.capacity }}
  {{- if .Values.volumeset.autoscaling.enabled }}
  autoscaling:
    maxCapacity: {{ .Values.volumeset.autoscaling.maxCapacity }}
    minFreePercentage: {{ .Values.volumeset.autoscaling.minFreePercentage }}
    scalingFactor: {{ .Values.volumeset.autoscaling.scalingFactor }}
  {{- end }}
  performanceClass: general-purpose-ssd
  snapshots:
    createFinalSnapshot: true
    retentionDuration: 7d
{{- end }}
