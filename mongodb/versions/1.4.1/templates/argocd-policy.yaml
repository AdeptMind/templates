{{- if .Values.argocd.enabled }}
{{- include "mongo.validate" . -}}
apiVersion: cpln.io/v1
kind: policy
metadata:
  name: {{ include "mongo.policy.name" . }}
  namespace: {{ .Release.Namespace }}
org: {{ required "argocd.org is required when argocd.enabled is true" .Values.argocd.org }}
description: Policy granting MongoDB identity access to its database credentials
tags:
  {{- include "mongo.tags" . | nindent 4 }}
bindings:
  - permissions:
      - reveal
    principalLinks:
      - //gvc/{{ .Values.global.cpln.gvc }}/identity/{{ include "mongo.identity.name" . }}
targetKind: secret
targetLinks:
  {{- /* the user's prerequisite credentials secret */}}
  - //secret/{{ .Values.config.credentialsSecretName }}
  {{- if .Values.backup.enabled }}
  - //secret/{{ include "mongo.secretDatabase.name" . }}
  {{- end }}
{{- end }}
