proxyWorkload:
  image: nginx:1.31.4 # pinned: `latest` makes installs non-reproducible
  port: 80
  capacityAI: false
  timeoutSeconds: 5

resources:
  cpu: 100m
  memory: 128Mi

autoscaling:
  minScale: 1
  maxScale: 1
  maxConcurrency: 1000

enableExample: true # set to true to deploy an example backend workload and route all traffic to it

locations: [] # add your own proxy targets here
  # - path: /
  #   workload: my-workload
  #   port: 8080
  #   regexModifier: ""

# Render Control Plane k8s-operator CRDs (cpln.io/v1) instead of `cpln helm` manifests,
# so the chart can be deployed by Argo CD. Resources land in the release namespace.
argocd:
  enabled: false
  org: ""
