# hpdp-redis cache in hpdp-qa via the CPLN k8s operator (replaces marketplace redis 3.0.2).
# maxmemory + LRU so the cache evicts instead of OOMing; persistence off (pure cache).
# Image pinned to redis:7.2 to match the running release.
# QA sentinel runs 0 replicas today; this chart blocks redis boot until a sentinel answers, so it needs >= 1.
# Manual sync on purpose; nothing is created until someone syncs the app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hpdp-redis-templates-hpdp-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AdeptMind/templates
    targetRevision: argocd
    path: redis/versions/3.7.0
    helm:
      releaseName: hpdp-redis
      valuesObject:
        argocd:
          enabled: true
          org: ad-nonprod-c349d9
        global:
          cpln:
            gvc: hpdp-qa
        redis:
          image: redis:7.2
          replicas: 3
          resources:
            maxCpu: 1000m
            maxMemory: 1500Mi
            minCpu: 250m
            minMemory: 500Mi
          extraArgs: "--maxmemory 1100mb --maxmemory-policy allkeys-lru --save '' --appendonly no"
          persistence:
            enabled: false
        sentinel:
          image: redis:7.2
          replicas: 1
          persistence:
            enabled: false
  destination:
    name: dev
    namespace: cpln-hpdp-qa
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
